name: Build and Deploy

on:
  repository_dispatch:
    types: [strapi-publish]

  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_API_TOKEN: ${{ secrets.NEXT_PUBLIC_API_TOKEN }}
      NEXT_PUBLIC_EMAIL_TOKEN: ${{ secrets.NEXT_PUBLIC_EMAIL_TOKEN }}
      NEXT_PUBLIC_DOMAIN_URL: ${{ secrets.NEXT_PUBLIC_DOMAIN_URL }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # --- NEW STEP: Wake up Strapi before building ---
      - name: Wake up Strapi (Cold Start Fix)
        run: |
          echo "Checking if Strapi is awake at ${{ secrets.NEXT_PUBLIC_API_URL }}..."
          # Tries to reach the API 15 times with 5-second intervals (75 seconds total)
          for i in {1..15}; do
            if curl -s --head --request GET ${{ secrets.NEXT_PUBLIC_API_URL }} | grep "200 OK" > /dev/null; then
              echo "Strapi is awake and responding!"
              exit 0
            fi
            echo "Attempt $i: Strapi is still sleeping. Waiting 5s..."
            sleep 5
          done
          echo "Error: Strapi failed to wake up in time. Build cancelled."
          exit 1

      - name: Build Project
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude='.htaccess' \
            --exclude='google71578d004d89a5cd.html' \
            --exclude='robots.txt' \
            --exclude='.well-known/' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./out/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/fastontime/domains/fastontime.co.th/public_html/
